# API Gateway - entry point duy nhat cho Android app.
#
# Vi sao Nginx ma khong phai Spring Cloud Gateway:
# Spring Cloud chua chac da co ban tuong thich Boot 4.1.x tai thoi diem nay, va plan
# goc cung de xuat "Docker Compose + Nginx lam gateway thu cong truoc".
# Khi Spring Cloud ra ban hop le cho Boot 4, thay service `gateway` trong
# docker-compose bang mot module Java la xong - client khong can doi gi.

server {
    listen 8080;
    server_name _;

    # Dynamic DNS resolution cho Docker container (ttl=10s)
    # Tranh loi 502 khi Docker tao lai container voi IP noi bo moi
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $user_service   http://user-service:8081;
    set $ledger_service http://ledger-service:8082;
    set $budget_service http://budget-service:8083;
    set $report_service http://report-service:8084;

    client_max_body_size 10m;

    # Log ro service nao nhan request - de debug luc moi tach service.
    access_log /var/log/nginx/gateway.access.log;

    location /api/auth     { proxy_pass $user_service;   include /etc/nginx/proxy_common.conf; }
    location /api/v1/auth  { proxy_pass $user_service;   include /etc/nginx/proxy_common.conf; }
    location /api/users    { proxy_pass $user_service;   include /etc/nginx/proxy_common.conf; }
    location /api/settings { proxy_pass $user_service;   include /etc/nginx/proxy_common.conf; }

    # ledger-service so huu wallet + transaction + category + recurring
    location /api/wallets      { proxy_pass $ledger_service; include /etc/nginx/proxy_common.conf; }
    location /api/transactions { proxy_pass $ledger_service; include /etc/nginx/proxy_common.conf; }
    location /api/categories   { proxy_pass $ledger_service; include /etc/nginx/proxy_common.conf; }
    location /api/recurring    { proxy_pass $ledger_service; include /etc/nginx/proxy_common.conf; }

    # budget-service so huu budget + limit + savings goal + auto-save
    location /api/budgets   { proxy_pass $budget_service; include /etc/nginx/proxy_common.conf; }
    location /api/limits    { proxy_pass $budget_service; include /etc/nginx/proxy_common.conf; }
    location /api/goals     { proxy_pass $budget_service; include /etc/nginx/proxy_common.conf; }
    location /api/auto-save { proxy_pass $budget_service; include /etc/nginx/proxy_common.conf; }

    # report-service so huu read model (CQRS)
    location /api/reports { proxy_pass $report_service; include /etc/nginx/proxy_common.conf; }
    location /api/stats   { proxy_pass $report_service; include /etc/nginx/proxy_common.conf; }
    location /api/export  { proxy_pass $report_service; include /etc/nginx/proxy_common.conf; }

    location /health { return 200 'gateway ok\n'; add_header Content-Type text/plain; }
}
