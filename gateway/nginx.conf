# API Gateway - entry point duy nhat cho Android app.
#
# Vi sao Nginx ma khong phai Spring Cloud Gateway:
# Spring Cloud chua chac da co ban tuong thich Boot 4.1.x tai thoi diem nay, va plan
# goc cung de xuat "Docker Compose + Nginx lam gateway thu cong truoc".
# Khi Spring Cloud ra ban hop le cho Boot 4, thay service `gateway` trong
# docker-compose bang mot module Java la xong - client khong can doi gi.

upstream user_service   { server user-service:8081; }
upstream ledger_service { server ledger-service:8082; }
upstream budget_service { server budget-service:8083; }
upstream report_service { server report-service:8084; }

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    # Log ro service nao nhan request - de debug luc moi tach service.
    access_log /var/log/nginx/gateway.access.log;

    location /api/auth/     { proxy_pass http://user_service;   include /etc/nginx/proxy_common.conf; }
    location /api/users/    { proxy_pass http://user_service;   include /etc/nginx/proxy_common.conf; }
    location /api/settings/ { proxy_pass http://user_service;   include /etc/nginx/proxy_common.conf; }

    # ledger-service so huu wallet + transaction + category + recurring
    location /api/wallets/      { proxy_pass http://ledger_service; include /etc/nginx/proxy_common.conf; }
    location /api/transactions/ { proxy_pass http://ledger_service; include /etc/nginx/proxy_common.conf; }
    location /api/categories/   { proxy_pass http://ledger_service; include /etc/nginx/proxy_common.conf; }
    location /api/recurring/    { proxy_pass http://ledger_service; include /etc/nginx/proxy_common.conf; }

    # budget-service so huu budget + limit + savings goal + auto-save
    location /api/budgets/   { proxy_pass http://budget_service; include /etc/nginx/proxy_common.conf; }
    location /api/limits/    { proxy_pass http://budget_service; include /etc/nginx/proxy_common.conf; }
    location /api/goals/     { proxy_pass http://budget_service; include /etc/nginx/proxy_common.conf; }
    location /api/auto-save/ { proxy_pass http://budget_service; include /etc/nginx/proxy_common.conf; }

    # report-service so huu read model (CQRS)
    location /api/reports/ { proxy_pass http://report_service; include /etc/nginx/proxy_common.conf; }
    location /api/stats/   { proxy_pass http://report_service; include /etc/nginx/proxy_common.conf; }
    location /api/export/  { proxy_pass http://report_service; include /etc/nginx/proxy_common.conf; }

    location /health { return 200 'gateway ok\n'; add_header Content-Type text/plain; }
}
