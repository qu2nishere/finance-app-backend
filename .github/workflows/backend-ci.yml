# CI backend: build + test 4 service tren may Ubuntu sach moi lan co PR / push.
# Giai thich tung khai niem: plan/2026-11-24/infra-ci/bai-giang-ci.md (ngoai repo).
name: backend-ci

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

# Push moi vao cung nhanh/PR -> huy lan chay cu, do ton phut.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Gia tri CHI DUNG CHO CI, khong mo khoa duoc he thong that nao.
  # docker-compose.yml bat buoc co bien nay; Spring doc no qua ${JWT_SECRET}.
  JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-0123456789

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [user, ledger, budget, report]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # Dung lai compose + init-databases.sql cua repo. --wait cho healthcheck xanh moi chay tiep.
      - name: Start postgres + rabbitmq
        run: docker compose up -d --wait postgres rabbitmq

      - name: Build and test
        working-directory: ${{ matrix.service }}-service
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}-service/build/reports/tests/
          retention-days: 7

      - name: Docker logs (khi loi)
        if: failure()
        run: docker compose logs postgres rabbitmq

  docker:
    name: docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Chi build de bat loi Dockerfile, khong push image (push la viec cua CD).
      - name: Build images
        run: docker compose build
